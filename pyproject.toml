[project]
name = "tool-agent-mcp"
version = "0.1.0"
description = "A multi-step tool-using agent: hand-written ReAct loop over an MCP server, with guardrails, tracing, and agent evals."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
